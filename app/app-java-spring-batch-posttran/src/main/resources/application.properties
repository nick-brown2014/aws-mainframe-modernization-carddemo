spring.main.banner-mode=off
spring.batch.job.enabled=false
spring.batch.jdbc.initialize-schema=always
spring.sql.init.mode=always

# Default embedded database; override with --spring.datasource.url=... for a real RDBMS.
spring.datasource.url=jdbc:h2:mem:posttran;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# Spec section 9.3 Q2: explicit clock zone for TRAN-PROC-TS generation (LPAR zone), never JVM default.
posttran.clock.zone=America/Chicago
# Spec section 6.3 / 6.5: input and output encodings (IBM037 / IBM1047 for EBCDIC transfers).
posttran.input.charset=UTF-8
posttran.output.charset=UTF-8
# "" for true fixed-block (RECFM=F) output, "\n" for newline-delimited text.
posttran.output.line-separator=\n

logging.level.root=WARN
